version: "3.7"
services:
  tronsave-mcp:
    container_name: tronsave-mcp
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "$MCP_PORT:$MCP_PORT"
    networks:
      - tronsave
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:'+(process.env.MCP_PORT||3000)+'/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
    deploy:
      resources:
        limits:
          memory: 1G
networks:
  tronsave:
    driver: bridge
    name: tronsave
